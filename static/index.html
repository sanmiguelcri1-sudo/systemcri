<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYSTEMCRI | Intersoftic</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css?v=20260608-audit-state-colors" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="logo">
          <img src="favicon.png" alt="CRI" />
          <span>SYSTEMCRI</span>
        </div>
        <nav>
          <button class="nav-btn active" data-tab="intersoftic-tab">
            <i class="fas fa-table-cells-large"></i>
            <span>Estadística</span>
          </button>
          <button class="nav-btn" data-tab="audit-tab">
            <i class="fas fa-triangle-exclamation"></i>
            <span>Auditoría</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <div class="network-status">
            <i class="fas fa-database"></i>
            Intersoftic local
          </div>
        </div>
      </aside>

      <main class="content">
        <section id="intersoftic-tab" class="tab-content active">
          <header class="tab-header">
            <div>
              <h1>Estadística Intersoftic</h1>
              <p id="intersoftic-meta">Sin actualizar</p>
            </div>
            <button id="refresh-intersoftic-btn" class="btn-primary">
              <i class="fas fa-rotate-right"></i>
              Actualizar
            </button>
          </header>

          <div id="intersoftic-branch-tabs" class="branch-tabs">
            <button class="branch-btn active" data-branch="all">Todas</button>
            <button class="branch-btn" data-branch="san_miguel">San Miguel</button>
            <button class="branch-btn" data-branch="ituzaingo">Ituzaingó</button>
            <button class="branch-btn" data-branch="merlo">Merlo</button>
          </div>

          <div id="intersoftic-summary" class="panel-grid"></div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Mes</th>
                  <th>MDTA</th>
                  <th>Cápita 250101</th>
                  <th>Cápita 250102</th>
                  <th>Neuro</th>
                  <th>TO</th>
                  <th>Fono</th>
                  <th>HD</th>
                  <th>Fisiatra</th>
                  <th>Domicilio</th>
                  <th>Traslado</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="intersoftic-body"></tbody>
            </table>
          </div>
        </section>

        <section id="audit-tab" class="tab-content">
          <header class="tab-header">
            <div>
              <h1>Auditoría Intersoftic</h1>
              <p id="audit-meta">Sin actualizar</p>
            </div>
            <button id="refresh-audit-btn" class="btn-primary">
              <i class="fas fa-rotate-right"></i>
              Actualizar
            </button>
          </header>

          <div id="audit-branch-tabs" class="branch-tabs">
            <button class="branch-btn active" data-branch="all">Todas</button>
            <button class="branch-btn" data-branch="san_miguel">San Miguel</button>
            <button class="branch-btn" data-branch="ituzaingo">Ituzaingó</button>
            <button class="branch-btn" data-branch="merlo">Merlo</button>
          </div>

          <div class="audit-search-row">
            <div class="search-bar">
              <i class="fas fa-search"></i>
              <input
                id="audit-search"
                type="text"
                placeholder="Buscar paciente, afiliado, prestación, ID u orden..."
                autocomplete="off"
              />
            </div>
          </div>

          <div id="audit-summary" class="panel-grid"></div>
          <div id="audit-container"></div>
        </section>
      </main>
    </div>

    <script src="app.js?v=20260608-audit-state-colors"></script>
  </body>
</html>
